<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PlanFlow</title>
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PlanFlow" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Native-feel daily planner with Apple Health and iOS Alarms bridge" />

    <!-- Apple Touch Icons & Favicons -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <style>
      /* Prevent iOS bounce scroll on outer window while allowing smooth scroll inside */
      html, body {
        height: 100%;
        width: 100%;
        overflow: hidden;
        background-color: #000000;
        color: #ffffff;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        user-select: none;
      }
      #root {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      /* Custom iOS scrollbars */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: #38383A;
        border-radius: 4px;
      }
    </style>
  </head>
  <body class="bg-black text-white font-sans antialiased selection:bg-ios-blue selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
