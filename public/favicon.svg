<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="50%" stop-color="#5E5CE6" />
      <stop offset="100%" stop-color="#BF5AF2" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30D158" />
      <stop offset="100%" stop-color="#64D2FF" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="#000000" />
  <rect x="24" y="24" width="464" height="464" rx="95" fill="url(#bgGrad)" opacity="0.15" />
  <!-- Clock / Schedule Icon -->
  <circle cx="256" cy="256" r="160" stroke="url(#ringGrad)" stroke-width="28" fill="none" stroke-linecap="round" />
  <!-- Clock hands -->
  <line x1="256" y1="256" x2="256" y2="150" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" />
  <line x1="256" y1="256" x2="330" y2="256" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" />
  <circle cx="256" cy="256" r="16" fill="#FFFFFF" />
  <!-- Heartbeat / Health pulse dot -->
  <circle cx="340" cy="180" r="26" fill="#FF453A" />
</svg>

